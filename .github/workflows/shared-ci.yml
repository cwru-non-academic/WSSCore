name: Common CI contracts
on:
  pull_request:
    paths: ['tools/ci/**', 'tools/release/**', '.github/workflows/shared-ci.yml']
  push:
    branches: [dev, main]
    paths: ['tools/ci/**', 'tools/release/**', '.github/workflows/shared-ci.yml']
permissions:
  contents: read
jobs:
  contracts:
    name: Common tooling contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read pinned integration reference
        id: integration
        shell: pwsh
        run: |
          $origin=(Get-Content tools/ci/sync-tooling.json -Raw|ConvertFrom-Json).origins.integration
          if($origin.repository -cne 'cwru-non-academic/Python_WSS_Integration_Lib' -or $origin.commit -cnotmatch '^[a-f0-9]{40}$') {throw 'Unreviewed integration origin'}
          "commit=$($origin.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.commit }}
          path: .ci-origins/Python_WSS_Integration_Lib
          persist-credentials: false
      - name: Report effective non-secret deployment switches
        shell: pwsh
        env:
          WSS_DEV_ACCEPTANCE_ENABLED: ${{ vars.WSS_DEV_ACCEPTANCE_ENABLED }}
          WSS_DEV_RELEASE_ENABLED: ${{ vars.WSS_DEV_RELEASE_ENABLED }}
        run: |
          foreach($name in @('WSS_DEV_ACCEPTANCE_ENABLED','WSS_DEV_RELEASE_ENABLED')) {
            $value=[Environment]::GetEnvironmentVariable($name)
            if($value -cnotin @('','true','false')) {throw "Unexpected boolean deployment switch: $name"}
            $display=if($value -ceq '') {'<unset>'} else {$value}
            Write-Output "$name=$display"
          }
      - run: node --test tools/release/*.test.mjs tools/ci/sync-tooling.test.mjs tools/ci/adapter-pins.test.mjs tools/ci/workflow-freeze-receiver.test.mjs
      - shell: pwsh
        run: |
          Get-ChildItem tools/ci/shared -File -Filter '*.ps1' | ForEach-Object {
            $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)|Out-Null
            if($errors){throw ($errors|Out-String)}
          }
      - shell: pwsh
        run: ./tools/ci/shared/Archive.Tests.ps1
      - shell: pwsh
        run: ./tools/ci/shared/Channel.Tests.ps1
