name: Common CI contracts
on:
  pull_request:
    paths: ['tools/ArtifactBuild/**', 'tools/ci/**', 'tools/release/**', '.github/workflows/shared-ci.yml', '.github/workflows/propagate-python.yml', '.github/workflows/propagate-unity.yml', '.github/workflows/propagate-matlab.yml', '.github/workflows/dev-propagation.yml', '.github/workflows/main-propagation.yml', '.github/workflows/dev-release.yml', '.github/workflows/main-release.yml', '.github/workflows/artifacts.yml', '.github/workflows/test-variable-snapshot-readiness.yml']
  push:
    branches: [dev, main]
    paths: ['tools/ArtifactBuild/**', 'tools/ci/**', 'tools/release/**', '.github/workflows/shared-ci.yml', '.github/workflows/propagate-python.yml', '.github/workflows/propagate-unity.yml', '.github/workflows/propagate-matlab.yml', '.github/workflows/dev-propagation.yml', '.github/workflows/main-propagation.yml', '.github/workflows/dev-release.yml', '.github/workflows/main-release.yml', '.github/workflows/artifacts.yml', '.github/workflows/test-variable-snapshot-readiness.yml']
permissions:
  contents: read
jobs:
  contracts:
    name: Common tooling contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - name: Verify restored assets and output propagation without native execution
        shell: pwsh
        run: |
          dotnet build -p:DisablePackageAssetsCache=true tools/ArtifactBuild/ArtifactBuild.csproj -p:RestoreLockedMode=true -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'ArtifactBuild helper build failed.' }
          ./tools/ci/shared/restored-assets/RestoredAssets.Tests.ps1 -HelperPath ./tools/ArtifactBuild/RestoredPackageAssets.cs
          ./tools/ci/shared/restored-assets/RestoreLayout.Tests.ps1 -HelperPath ./tools/ArtifactBuild/RestoredPackageAssets.cs
          ./tools/ci/shared/restored-assets/PrebuiltPackageOverride.Tests.ps1 -ArtifactBuildAssembly ./tools/ArtifactBuild/bin/Debug/net9.0/ArtifactBuild.dll
      - name: Read pinned integration reference
        id: integration
        shell: pwsh
        run: |
          $origin=(Get-Content tools/ci/sync-tooling.json -Raw|ConvertFrom-Json).origins.integration
          if($origin.repository -cne 'cwru-non-academic/Python_WSS_Integration_Lib' -or $origin.commit -cnotmatch '^[a-f0-9]{40}$') {throw 'Unreviewed integration origin'}
          "commit=$($origin.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.commit }}
          path: .ci-origins/Python_WSS_Integration_Lib
          persist-credentials: false
      - name: Check reviewed executable guards and both channel policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/adapter-pins.mjs check-guards
      - name: Report effective non-secret deployment switches
        shell: pwsh
        env:
          WSS_DEV_ACCEPTANCE_ENABLED: ${{ vars.WSS_DEV_ACCEPTANCE_ENABLED }}
          WSS_DEV_RELEASE_ENABLED: ${{ vars.WSS_DEV_RELEASE_ENABLED }}
        run: |
          foreach($name in @('WSS_DEV_ACCEPTANCE_ENABLED','WSS_DEV_RELEASE_ENABLED')) {
            $value=[Environment]::GetEnvironmentVariable($name)
            if($value -cnotin @('','true','false')) {throw "Unexpected boolean deployment switch: $name"}
            $display=if($value -ceq '') {'<unset>'} else {$value}
            Write-Output "$name=$display"
          }
      - run: node --test tools/release/*.test.mjs tools/ci/test-selection.test.mjs tools/ci/selected-test-source.test.mjs tools/ci/ci-test-selection.test.mjs tools/ci/ci-test-selection-cli.test.mjs tools/ci/producer-test-selection.test.mjs tools/ci/sync-tooling.test.mjs tools/ci/native-receipt-adapter.test.mjs tools/ci/adapter-pins.test.mjs tools/ci/restored-assets-invocations.test.mjs tools/ci/stage-guard-pins.test.mjs tools/ci/workflow-freeze-receiver.test.mjs tools/ci/unity-concurrency.test.mjs
      - name: Test pinned receipt owner against the generated receiver closure
        env:
          WSS_CORE_REFERENCE: ${{ github.workspace }}
        run: node --test .ci-origins/Python_WSS_Integration_Lib/.github/scripts/wss-ci/tests/receipt.test.mjs .ci-origins/Python_WSS_Integration_Lib/.github/scripts/wss-ci/tests/receipt-paths.test.mjs
      - name: Reject independently edited channel controller workflows
        run: node tools/ci/channel-workflows.mjs check
      - shell: pwsh
        run: |
          Get-ChildItem tools/ci/shared -File -Filter '*.ps1' | ForEach-Object {
            $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)|Out-Null
            if($errors){throw ($errors|Out-String)}
          }
      - shell: pwsh
        run: ./tools/ci/shared/Archive.Tests.ps1
      - shell: pwsh
        run: ./tools/ci/shared/Channel.Tests.ps1
