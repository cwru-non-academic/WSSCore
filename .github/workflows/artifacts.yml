name: Build runtime artifacts

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-conformance:
    name: Core conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore Core conformance dependencies
        run: dotnet restore tests/WSS.Core.Tests/WSS.Core.Tests.csproj --locked-mode --nologo
      - name: Run Core conformance
        run: dotnet test tests/WSS.Core.Tests/WSS.Core.Tests.csproj --configuration Release --no-restore --nologo

  artifacts:
    name: Build and validate artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build, stage, and validate all artifacts
        run: dotnet run --project tools/ArtifactBuild/ArtifactBuild.csproj -- build-all
      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core
          path: artifacts/core
          if-no-files-found: error
      - name: Upload Serial artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial
          path: artifacts/serial
          if-no-files-found: error
      - name: Upload unified BLE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ble-unified
          path: artifacts/ble-unified
          if-no-files-found: error

  core-consumer:
    needs:
      - artifacts
      - core-conformance
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: ${{ runner.temp }}/wss-core
      - name: Restore, build, and run Core consumer
        run: |
          dotnet restore tests/ArtifactConsumers/CoreConsumer/CoreConsumer.csproj --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-core"
          dotnet build tests/ArtifactConsumers/CoreConsumer/CoreConsumer.csproj --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-core"
          dotnet run --project tests/ArtifactConsumers/CoreConsumer/CoreConsumer.csproj --no-build --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-core"

  serial-consumer:
    needs:
      - artifacts
      - core-conformance
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@v4
        with:
          name: serial
          path: ${{ runner.temp }}/wss-serial
      - name: Restore, build, and run Serial consumer
        run: |
          dotnet restore tests/ArtifactConsumers/SerialConsumer/SerialConsumer.csproj --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-serial"
          dotnet build tests/ArtifactConsumers/SerialConsumer/SerialConsumer.csproj --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-serial"
          dotnet run --project tests/ArtifactConsumers/SerialConsumer/SerialConsumer.csproj --no-build --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-serial"

  ble-consumer:
    needs:
      - artifacts
      - core-conformance
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install and verify BlueZ
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes bluez

          bluetoothd="$(command -v bluetoothd || true)"
          if [[ -z "$bluetoothd" ]]; then
            bluetoothd=/usr/libexec/bluetooth/bluetoothd
          fi

          if [[ ! -x "$bluetoothd" ]]; then
            echo "BlueZ bluetoothd executable was not found or is not executable: $bluetoothd" >&2
            exit 1
          fi

          "$bluetoothd" --version
          echo "BlueZ runtime: PASS"

          busctl --system --no-pager list >/dev/null
          echo "System D-Bus: PASS"

          set +e
          btmgmt_output="$(sudo btmgmt info 2>&1)"
          btmgmt_status=$?
          set -e
          printf '%s\n' "$btmgmt_output"

          if (( btmgmt_status == 0 )) && [[ "$btmgmt_output" == "Index list with 0 items" ]]; then
            echo "WSS_BLE_SKIP_NATIVE_PROBE=1" >> "$GITHUB_ENV"
            echo "No Bluetooth controller is exposed by the hosted runner."
            exit 0
          fi

          if (( btmgmt_status != 0 )); then
            if [[ "$btmgmt_output" == *"Unable to open mgmt_socket"* ]]; then
              echo "WSS_BLE_SKIP_NATIVE_PROBE=1" >> "$GITHUB_ENV"
              echo "Bluetooth management interface: NOT AVAILABLE (acceptable)"
              exit 0
            fi

            echo "Unexpected btmgmt failure." >&2
            exit "$btmgmt_status"
          fi

          sudo systemctl start bluetooth.service || true

          if ! busctl --system --no-pager status org.bluez >/dev/null 2>&1; then

            sudo nohup "$bluetoothd" --nodetach >"$RUNNER_TEMP/bluetoothd.log" 2>&1 &

            for _ in {1..20}; do
              if busctl --system --no-pager status org.bluez >/dev/null 2>&1; then
                break
              fi
              sleep 0.25
            done
          fi

          if ! busctl --system --no-pager status org.bluez; then
            cat "$RUNNER_TEMP/bluetoothd.log" 2>/dev/null || true
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ble-unified
          path: ${{ runner.temp }}/wss-ble-unified
      - name: Restore, build, and run unified BLE consumer
        run: |
          dotnet restore tests/ArtifactConsumers/BleConsumer/BleConsumer.csproj --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-ble-unified"
          dotnet build tests/ArtifactConsumers/BleConsumer/BleConsumer.csproj --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-ble-unified"
          dotnet run --project tests/ArtifactConsumers/BleConsumer/BleConsumer.csproj --no-build --no-restore --nologo -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/wss-ble-unified"

  release:
    needs:
      - core-conformance
      - artifacts
      - core-consumer
      - serial-consumer
      - ble-consumer
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download Core artifact
        uses: actions/download-artifact@v4
        with:
          name: core
          path: ${{ runner.temp }}/release-input/core
      - name: Download Serial artifact
        uses: actions/download-artifact@v4
        with:
          name: serial
          path: ${{ runner.temp }}/release-input/serial
      - name: Download unified BLE artifact
        uses: actions/download-artifact@v4
        with:
          name: ble-unified
          path: ${{ runner.temp }}/release-input/ble-unified
      - name: Package release assets and checksums
        shell: bash
        run: |
          set -euo pipefail

          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"

          (
            cd "$RUNNER_TEMP/release-input/core"
            zip -q -r "$assets/WSS-Core-${TAG}.zip" .
          )
          (
            cd "$RUNNER_TEMP/release-input/serial"
            zip -q -r "$assets/WSS-Serial-${TAG}.zip" .
          )
          (
            cd "$RUNNER_TEMP/release-input/ble-unified"
            zip -q -r "$assets/WSS-BLE-Unified-${TAG}.zip" .
          )

          (
            cd "$assets"
            sha256sum \
              "WSS-Core-${TAG}.zip" \
              "WSS-Serial-${TAG}.zip" \
              "WSS-BLE-Unified-${TAG}.zip" \
              > SHA256SUMS.txt
          )
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/release-assets"

          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            "WSS-Core-${TAG}.zip" \
            "WSS-Serial-${TAG}.zip" \
            "WSS-BLE-Unified-${TAG}.zip" \
            SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            "${prerelease_args[@]}"
