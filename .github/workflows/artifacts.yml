name: Build universal WSS release

on:
  pull_request:
    branches: [dev, main, net2_BLE]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract-tests:
    name: Dev release acceptance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/release/verify.test.mjs

  macos-native:
    name: Build macOS universal BLE bridge
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify production x86_64 and arm64 bridge
        run: bash tools/MacBleBridge/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-input
          path: tools/MacBleBridge/out/libwss_macos_ble.dylib
          if-no-files-found: error

  core-tests:
    name: Core conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore Core conformance with locked dependencies
        id: restore_core
        run: dotnet restore tests/Core/WSS.Core.Tests/WSS.Core.Tests.csproj --locked-mode --nologo
      - name: Run Core source-project conformance tests
        id: core_conformance
        run: dotnet test tests/Core/WSS.Core.Tests/WSS.Core.Tests.csproj -c Release --no-restore --nologo --logger "trx;LogFileName=core.trx" --results-directory "${{ runner.temp }}/test-results"
      - name: Retain detailed Core test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-conformance-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: ignore
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: Core conformance
          REPORT_PURPOSE: Source-project Core protocol, configuration, initialization, and emulated transport conformance.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  ble-linux-tests:
    name: BLE consumer (Linux)
    needs: package-universal
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore portable BLE with locked dependencies
        id: restore_portable_ble
        run: dotnet restore tests/BLE/WSS.BLE.Tests/WSS.BLE.Tests.csproj --locked-mode --nologo
      - name: Run portable BLE source-project tests including Linux compatibility
        id: portable_ble_tests
        run: dotnet test tests/BLE/WSS.BLE.Tests/WSS.BLE.Tests.csproj -c Release --no-restore --nologo --logger "trx;LogFileName=portable-ble.trx" --results-directory "${{ runner.temp }}/test-results"
      - name: Download the authoritative universal ZIP
        id: download_universal_zip
        uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify checksum and extract the identical universal payload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/universal"
      - name: Install BlueZ and classify controller availability
        id: bluez_controller_classification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bluez
          bluetoothd="$(command -v bluetoothd || true)"
          if [[ -z "$bluetoothd" ]]; then bluetoothd=/usr/libexec/bluetooth/bluetoothd; fi
          test -x "$bluetoothd"
          "$bluetoothd" --version
          busctl --system --no-pager list >/dev/null
          set +e
          output="$(sudo btmgmt info 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if { (( status == 0 )) && [[ "$output" == 'Index list with 0 items' ]]; } || [[ "$output" == *'Unable to open mgmt_socket'* ]]; then
            echo 'WSS_BLE_SKIP_NATIVE_PROBE=1' >> "$GITHUB_ENV"
            echo 'No controller/management interface; managed dependency tests still mandatory. Native probe NOT EXECUTED.'
            exit 0
          fi
          if (( status != 0 )); then exit "$status"; fi
          sudo systemctl start bluetooth.service || true
          if ! busctl --system --no-pager status org.bluez >/dev/null 2>&1; then
            sudo nohup "$bluetoothd" --nodetach >"$RUNNER_TEMP/bluetoothd.log" 2>&1 &
            for _ in {1..20}; do
              if busctl --system --no-pager status org.bluez >/dev/null 2>&1; then break; fi
              sleep 0.25
            done
          fi
          busctl --system --no-pager status org.bluez
      - name: Build BLE consumer .NET 9 against packaged DLLs
        id: build_ble_consumer_net9
        run: dotnet build tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" --nologo
      - name: Run BLE consumer .NET 9 automatic backend loading (no stimulation)
        id: ble_consumer_net9_automatic
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release --no-build --no-restore -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal"
      - name: Run BLE consumer .NET 9 explicit Linux backend registration
        id: ble_consumer_net9_explicit
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release --no-build --no-restore -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" -- --register
      - name: Retain detailed portable BLE test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-linux-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: ignore
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: BLE consumer (Linux)
          REPORT_PURPOSE: Portable source-project BLE functionality and packaged Linux backend/dependency activation; no peripheral connections or writes.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  ble-windows-tests:
    name: BLE consumer (Windows)
    needs: package-universal
    runs-on: windows-2022
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore native bridge tests with locked dependencies
        id: restore_native_ble
        run: dotnet restore tests/BLE/Windows/WSS.BLE.Windows.Tests/WSS.BLE.Windows.Tests.csproj --locked-mode --nologo
      - name: Build production Release/x64 DLL and isolated test shim
        id: build_production_native_and_isolated_shim
        shell: pwsh
        run: ./tools/WindowsBleBridge/build.ps1 -Configuration Release -Architecture x64
      - name: Run native bridge/adapter, isolated shim, and production regression NUnit tests
        id: native_bridge_adapter_shim_and_production_regressions
        run: dotnet test tests/BLE/Windows/WSS.BLE.Windows.Tests/WSS.BLE.Windows.Tests.csproj -c Release --no-build --no-restore --nologo --logger "trx;LogFileName=windows-native.trx" --results-directory "${{ runner.temp }}/test-results"
      - name: Build Linux Standard backend without rebuilding shared assemblies
        id: build_linux_compatibility_backend
        run: dotnet build WSS.Transport.BLE.Linux/WSS.Transport.BLE.Linux.csproj -c Release --no-dependencies -p:RestoreLockedMode=true --nologo
      - name: Run Windows portable BLE facade and Linux compatibility tests
        id: portable_ble_tests
        run: |
          dotnet build WSS.Transport.BLE.MacOS/WSS.Transport.BLE.MacOS.csproj -c Release --no-dependencies -p:RestoreLockedMode=true --nologo
          dotnet test tests/BLE/WSS.BLE.Tests/WSS.BLE.Tests.csproj -c Release -p:RestoreLockedMode=true -p:BuildProjectReferences=false --nologo --logger "trx;LogFileName=portable-ble.trx" --results-directory "${{ runner.temp }}/test-results"
      - name: Download the authoritative universal ZIP
        id: download_universal_zip
        uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify checksum and extract the identical universal payload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/universal"
      - name: Build BLE consumer .NET 9 against packaged DLLs
        id: build_ble_consumer_net9
        run: dotnet build tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" --nologo
      - name: Run BLE consumer .NET 9 automatic Windows backend selection (no stimulation)
        id: ble_consumer_net9_automatic
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release --no-build --no-restore -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal"
      - name: Run BLE consumer .NET 9 explicit Windows backend registration
        id: ble_consumer_net9_explicit
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release --no-build --no-restore -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" -- --register
      - name: Run BLE consumer .NET 8 automatic Windows backend selection
        id: ble_consumer_net8_automatic
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release -p:ConsumerTargetFramework=net8.0 -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal"
      - name: Retain detailed portable and Windows native BLE test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-windows-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: ignore
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: BLE consumer (Windows)
          REPORT_PURPOSE: Portable and native source-project BLE tests with isolated shim/production DLLs, plus packaged Windows BLE consumers on .NET 9 and .NET 8.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  package-universal:
    name: Build and validate artifacts
    needs: macos-native
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload_universal_assets.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ci' }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Download this run's verified universal macOS native input
        id: download_macos_native
        uses: actions/download-artifact@v4
        with:
          name: macos-native-input
          path: tools/MacBleBridge/out
      - name: Build own managed and production-native inputs, validate closure, and create the one ZIP and checksum
        id: build_and_package_universal
        # Windows builds here; the current-run macOS build is aggregated unchanged.
        run: dotnet run --project tools/ArtifactBuild/ArtifactBuild.csproj -- build-all --destination "${{ runner.temp }}/release-assets/WSS-Universal" --tag "${{ env.RELEASE_TAG }}"
      - name: Verify checksum and archive extraction before upload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-assets" -Destination "$env:RUNNER_TEMP/package-verification"
      - name: Validate extracted manifest, native exports, and dependencies
        id: validate_package_contract
        run: dotnet run --project tools/ArtifactBuild/ArtifactBuild.csproj -- validate --manifest tools/ArtifactBuild/manifests/universal.json --package "${{ runner.temp }}/package-verification/WSS-Universal"
      - name: Universal rejection contract checks
        id: package_rejection_checks
        run: python tests/Packaging/verify_universal.py "${{ runner.temp }}/package-verification/WSS-Universal"
      - name: Upload the single release archive and metadata
        id: upload_universal_assets
        uses: actions/upload-artifact@v4
        with:
          name: universal-release-assets
          path: |
            ${{ runner.temp }}/release-assets/WSS-Universal-*.zip
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: Build and validate artifacts
          REPORT_PURPOSE: Build and validate one authoritative universal ZIP/checksum from this runner's own managed, Linux backend, and production-native inputs; no functional suites.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  ble-macos-tests:
    name: BLE consumer (macOS ${{ matrix.arch }})
    needs: package-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-14
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Run portable BLE and simulated macOS lifecycle contracts
        id: portable_ble_tests
        run: dotnet test tests/BLE/WSS.BLE.Tests/WSS.BLE.Tests.csproj -c Release -p:RestoreLockedMode=true --nologo --logger "trx;LogFileName=macos.trx" --results-directory "${{ runner.temp }}/test-results"
      - name: Download the authoritative universal ZIP
        id: download_universal_zip
        uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify checksum and extract the identical universal payload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/universal"
      - name: Verify actual packaged universal architectures, exports and native load
        id: native_abi_load
        run: python3 tools/MacBleBridge/verify_native.py "${{ runner.temp }}/universal/WSS-Universal/backends/macos/libwss_macos_ble.dylib"
      - name: Packaged automatic macOS backend on .NET 9
        id: ble_consumer_net9_automatic
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal"
      - name: Packaged explicit macOS registration on .NET 9
        id: ble_consumer_net9_explicit
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release --no-build --no-restore -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" -- --register
      - name: Packaged automatic macOS backend on .NET 8
        id: ble_consumer_net8_automatic
        run: dotnet run --project tests/Packaging/Consumers/BleConsumer/BleConsumer.csproj -c Release -p:ConsumerTargetFramework=net8.0 -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal"
      - name: Retain detailed test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-macos-${{ matrix.arch }}-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: ignore
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: BLE consumer (macOS ${{ matrix.arch }})
          REPORT_PURPOSE: Mandatory packaged managed/native ABI loading and simulated lifecycle contracts. Bluetooth authorization, adapter, physical peripheral connection and writes NOT EXECUTED.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/summarize.py

  serial-tests:
    name: Serial consumer (${{ matrix.platform }})
    needs: package-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Download the authoritative universal ZIP
        id: download_universal_zip
        uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify checksum and extract the identical universal payload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/universal"
      # Artifact/dependency checks only; future platform-specific Serial functional tests belong here.
      - name: Serial artifact-only consumer
        id: serial_artifact_consumer
        run: dotnet run --project tests/Packaging/Consumers/SerialConsumer/SerialConsumer.csproj -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" --nologo
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: Serial consumer (${{ matrix.platform }})
          REPORT_PURPOSE: Packaged Serial construction/options/state/disposal and Core/Serial/Ports dependency compatibility; no Serial port I/O.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  core-consumers:
    name: Core consumer (${{ matrix.platform }})
    needs: package-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
      - name: Install .NET SDKs
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Download the authoritative universal ZIP
        id: download_universal_zip
        uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify checksum and extract the identical universal payload
        id: verify_and_extract_zip
        shell: pwsh
        run: ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/universal"
      - name: Validate exact managed and native package identities
        id: validate_package_contract
        run: dotnet run --project tools/ArtifactBuild/ArtifactBuild.csproj -- validate --manifest tools/ArtifactBuild/manifests/universal.json --package "${{ runner.temp }}/universal/WSS-Universal"
      - name: Core artifact-only consumer
        id: core_artifact_consumer
        run: dotnet run --project tests/Packaging/Consumers/CoreConsumer/CoreConsumer.csproj -p:WSS_ARTIFACT_DIR="${{ runner.temp }}/universal/WSS-Universal" --nologo
      - name: Universal rejection contract checks (Linux filesystem)
        id: linux_package_rejection_checks
        if: runner.os == 'Linux'
        run: python tests/Packaging/verify_universal.py "${{ runner.temp }}/universal/WSS-Universal"
      - name: Summarize actual execution
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: Core consumer (${{ matrix.platform }})
          REPORT_PURPOSE: Packaged Core public API/emulated operation and platform-wide universal inventory, identity, dependency, and native validation.
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python tools/ci/summarize.py

  propagate-universal:
    name: Start routine downstream validation
    needs: [core-tests, ble-linux-tests, ble-windows-tests, ble-macos-tests, package-universal, serial-tests, core-consumers]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'cwru-non-academic/WSSCore' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: universal-release-assets
          path: ${{ runner.temp }}/release-input
      - name: Verify the already-tested archive and handoff identity
        id: candidate
        shell: pwsh
        env:
          APP_ID: ${{ vars.WSS_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          ARTIFACT_ID: ${{ needs.package-universal.outputs.artifact-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:APP_ID -or -not $env:APP_KEY) { throw 'WSS GitHub App credentials are unavailable to WSSCore; downstream propagation cannot start.' }
          if ($env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Missing universal producer artifact ID.' }
          ./tools/ArtifactBuild/extract-universal.ps1 -ReleaseAssets "$env:RUNNER_TEMP/release-input" -Destination "$env:RUNNER_TEMP/handoff-verification"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/release-input/WSS-Universal-ci.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: vars.WSS_DEV_RELEASE_ENABLED == 'true'
        with:
          node-version: '24'
      - name: Freeze the reviewed all-target dev release plan
        if: vars.WSS_DEV_RELEASE_ENABLED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_SHA: ${{ github.sha }}
          PRODUCER_RUN: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.package-universal.outputs.artifact-id }}
          SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          @{ repository='cwru-non-academic/WSSCore'; commit=$env:PRODUCER_SHA; run_id=$env:PRODUCER_RUN; artifact_id=$env:ARTIFACT_ID; archive='WSS-Universal-ci.zip'; sha256=$env:SHA256 } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/candidate.json"
          node tools/release/cli.mjs freeze "$env:RUNNER_TEMP/candidate.json" tools/release/targets.dev.json "$env:RUNNER_TEMP/release-plan"
          if ($LASTEXITCODE -ne 0) { throw 'Required receiver receipt tooling is unavailable; no all-clear plan or handoff.' }
      - uses: actions/upload-artifact@v4
        if: vars.WSS_DEV_RELEASE_ENABLED == 'true'
        with:
          name: wss-propagation-plan
          path: ${{ runner.temp }}/release-plan/plan.json
          if-no-files-found: error
      - name: Create Integration dispatch-only App token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-actions: write
      - name: Hand off to the existing routine Integration promotion workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          PRODUCER_SHA: ${{ github.sha }}
          PRODUCER_RUN: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.package-universal.outputs.artifact-id }}
          SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{
            ref = 'dev'
            inputs = @{
              wss_run_id = $env:PRODUCER_RUN; wss_commit = $env:PRODUCER_SHA
              wss_artifact_id = $env:ARTIFACT_ID; wss_sha256 = $env:SHA256
              correlation_id = "wss-$env:PRODUCER_RUN-$env:ARTIFACT_ID"
            }
          } | ConvertTo-Json -Depth 4 -Compress
          $body | gh api --method POST repos/cwru-non-academic/CSharp_WSS_Integration_Lib/actions/workflows/promote-wss.yml/dispatches --input -
          if ($LASTEXITCODE -ne 0) { throw 'Routine handoff failed: verify App installation, Integration Actions-write permission, and the deployed dev workflow.' }
