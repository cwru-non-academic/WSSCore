name: Reconcile __WSS_CHANNEL__ acceptance and optional __WSS_KIND__ publication
run-name: Reconcile __WSS_CHANNEL__ __WSS_KIND__ candidate ${{ inputs.producer_run_id || github.event.workflow_run.id || 'current-__WSS_CHANNEL__' }}

on:
  workflow_run:
    workflows: [Build universal WSS release]
    types: [completed]
    branches: [__WSS_CHANNEL__]
  schedule:
    - cron: '__WSS_ACCEPTANCE_MINUTE__ * * * *'
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Exact canonical __WSS_CHANNEL__ push run; empty selects the unique current-__WSS_CHANNEL__ run
        required: false
        type: string
      mode:
        description: Verify is read-only; reconcile may dispatch proof and use the existing publication gate
        type: choice
        options: [verify, reconcile]
        default: __WSS_MODE_DEFAULT__

env:
  WSS_CI_CHANNEL: __WSS_CHANNEL__
  WSS_DEV_ACCEPTANCE_ENABLED: ${{ vars.WSS_DEV_ACCEPTANCE_ENABLED }}
  __WSS_PUBLICATION_VARIABLE__: ${{ vars.__WSS_PUBLICATION_VARIABLE__ }}

permissions:
  contents: read
  actions: read

concurrency:
  group: wss-__WSS_CHANNEL__-__WSS_KIND__-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Verify nine merged targets without publication
    if: >-
      github.repository == 'cwru-non-academic/WSSCore' &&
      vars.WSS_DEV_ACCEPTANCE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == '__WSS_CHANNEL__' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      producer_run_id: ${{ steps.producer.outputs.run_id }}
    permissions:
      contents: read
      actions: read
    steps:
      # workflow_run is privileged: executable code always comes from main, never the candidate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create read-only cross-repository evidence token
        id: evidence-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            Python_WSS_Integration_Lib
            CLI_Python_WSS_Application
            ROS_Python_WSS_Application
            Matlab_WSS_Integration_Lib
            CLI_Matlab_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Select exact canonical __WSS_CHANNEL__ producer
        id: producer
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          REQUESTED_RUN: ${{ inputs.producer_run_id || github.event.workflow_run.id }}
        run: node tools/release/select-producer.mjs
      - name: Prepare read-only reconciliation intents
        if: __WSS_RECONCILE__
        id: reconciliation
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          WSS_DEV_ACCEPTANCE_ENABLED: ${{ vars.WSS_DEV_ACCEPTANCE_ENABLED }}
        run: node tools/release/cli.mjs prepare-dispatches '${{ steps.producer.outputs.run_id }}' '${{ runner.temp }}/dispatch-intent'
      - name: Retain dispatch intent before any cross-repository request
        if: __WSS_RECONCILE__
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reconciliation.outputs.artifact_name }}
          path: ${{ runner.temp }}/dispatch-intent/intent.json
          if-no-files-found: error
      - name: Create receipt reconciliation Actions token
        if: __WSS_RECONCILE__
        id: receipt-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            Python_WSS_Integration_Lib
            CLI_Python_WSS_Application
            ROS_Python_WSS_Application
            Matlab_WSS_Integration_Lib
            CLI_Matlab_WSS_Application
          permission-actions: write
      - name: Reconcile existing merges with fresh normal CI and read-only receipts
        if: __WSS_RECONCILE__
        env:
          GH_TOKEN: ${{ steps.receipt-token.outputs.token }}
          WSS_JOURNAL_READ_TOKEN: ${{ steps.evidence-token.outputs.token }}
          WSS_DEV_ACCEPTANCE_ENABLED: ${{ vars.WSS_DEV_ACCEPTANCE_ENABLED }}
        run: node tools/release/cli.mjs dispatch '${{ steps.producer.outputs.run_id }}' '${{ runner.temp }}/dispatch-intent/intent.json'

  verify:
    name: Verify fresh acceptance receipts
    needs: reconcile
    if: needs.reconcile.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create read-only cross-repository evidence token
        id: evidence-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            Python_WSS_Integration_Lib
            CLI_Python_WSS_Application
            ROS_Python_WSS_Application
            Matlab_WSS_Integration_Lib
            CLI_Matlab_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Require the original selected producer
        env:
          PRODUCER_RUN_ID: ${{ needs.reconcile.outputs.producer_run_id }}
        run: |
          if [[ ! "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Missing or invalid original reconciliation producer output' >&2
            exit 1
          fi
      - name: Collect actual merge receipts and verify every required target
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          PRODUCER_RUN_ID: ${{ needs.reconcile.outputs.producer_run_id }}
        run: node tools/release/cli.mjs verify "$PRODUCER_RUN_ID" '${{ runner.temp }}/accepted'
      - uses: actions/upload-artifact@v4
        with:
          name: __WSS_CHANNEL__-release-acceptance-${{ needs.reconcile.outputs.producer_run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted/acceptance.json
          if-no-files-found: error

  publish:
    name: Publish exact accepted __WSS_KIND__ bytes only when explicitly enabled
    needs: [reconcile, verify]
    if: >-
      __WSS_ENABLED__ && (__WSS_RECONCILE__) && github.run_attempt == 1 &&
      needs.reconcile.result == 'success' && needs.verify.result == 'success' &&
      vars.WSS_DEV_ACCEPTANCE_ENABLED == 'true' &&
      vars.__WSS_PUBLICATION_VARIABLE__ == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create read-only cross-repository evidence token
        id: evidence-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            Python_WSS_Integration_Lib
            CLI_Python_WSS_Application
            ROS_Python_WSS_Application
            Matlab_WSS_Integration_Lib
            CLI_Matlab_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Recollect all live proof and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          WSS_EVIDENCE_READ_TOKEN: ${{ steps.evidence-token.outputs.token }}
          __WSS_PUBLICATION_VARIABLE__: ${{ vars.__WSS_PUBLICATION_VARIABLE__ }}
        run: node tools/release/cli.mjs publish '${{ needs.reconcile.outputs.producer_run_id }}' '${{ runner.temp }}/accepted'
